name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v ./...

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output_name="goroviz"

            echo "Building ${os}/${arch}..."
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w" -o "dist/${output_name}" ./cmd/goroviz/

            # Create tarball
            tar -czf "dist/goroviz_${{ steps.version.outputs.VERSION }}_${os}_${arch}.tar.gz" \
              -C dist "${output_name}" \
              -C "${{ github.workspace }}" LICENSE README.md

            rm "dist/${output_name}"
          done

          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
